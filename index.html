<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Mail | Ultra Stable</title>
    
    <!-- טעינת Firebase בגרסה אחת מלאה דרך Cloudflare שקשה לחסום -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 20px; width: 330px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        h1 { color: #1e3c72; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 18px; margin-top: 10px; }
        .hidden { display: none !important; }
        .link { color: #1e3c72; cursor: pointer; text-decoration: underline; display: block; margin-top: 15px; font-size: 14px; background: none; border: none; width: 100%; }
        #status { font-size: 11px; color: #555; margin-top: 15px; padding: 5px; background: #eee; border-radius: 5px; }
        #inbox { height: 140px; border: 1px solid #eee; overflow-y: auto; margin: 15px 0; background: #f9f9f9; padding: 5px; text-align: right; }
    </style>
</head>
<body>

<div class="card">
    <h1 id="title">B-Mail</h1>
    
    <div id="auth-ui">
        <input type="text" id="u" placeholder="שם משתמש (למשל bino)">
        <div id="pass-div" class="hidden">
            <input type="password" id="p" placeholder="הכנס סיסמה">
        </div>
        <button id="btn-main" onclick="handleAuth()">המשך</button>
        <button class="link" id="toggle-btn" onclick="toggleMode()">צור חשבון חדש</button>
    </div>

    <div id="mail-ui" class="hidden">
        <h3 id="hello"></h3>
        <div id="inbox">טוען הודעות...</div>
        <input type="text" id="to" placeholder="אל (שם משתמש)">
        <textarea id="msg" placeholder="כתוב מסר..."></textarea>
        <button onclick="doSend()" style="background:#27ae60">שלח מסר</button>
        <button class="link" onclick="location.reload()">התנתק</button>
    </div>
    
    <div id="status">מנסה להתחבר...</div>
</div>

<script>
    var db;
    var myName = "";
    var isReg = false;

    // הגדרות Firebase
    const config = {
        apiKey: "AIzaSyANG1mVIHW12mer7KKWl2RpUI7Ld2spOyI",
        authDomain: "://firebaseapp.com",
        projectId: "bmail-f3665",
        databaseURL: "https://firebaseio.com"
    };

    // פונקציית אתחול סופר-מהירה
    function start() {
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(config);
            db = firebase.database();
            document.getElementById('status').innerText = "✅ מחובר לשרת Bino";
            document.getElementById('status').style.color = "green";
        } else {
            document.getElementById('status').innerText = "⌛ ממתין לסינכרון ענן (רענן אם לוקח זמן)...";
            setTimeout(start, 1000);
        }
    }

    start();

    function toggleMode() {
        isReg = !isReg;
        document.getElementById('title').innerText = isReg ? "הרשמה" : "B-Mail";
        document.getElementById('pass-div').classList.toggle('hidden', !isReg);
        document.getElementById('btn-main').innerText = isReg ? "צור חשבון" : "המשך";
        document.getElementById('toggle-btn').innerText = isReg ? "יש לי חשבון" : "צור חשבון חדש";
    }

    function handleAuth() {
        if (!db) return alert("המערכת בטעינה...");
        var u = document.getElementById('u').value.trim().toLowerCase();
        var p = document.getElementById('p').value;
        if (!u) return alert("נא להזין שם");

        if (isReg) {
            if (!p) return alert("נא להזין סיסמה");
            db.ref('users/' + u).set({ password: p }).then(function() {
                alert("חשבון " + u + "@bino נוצר! עכשיו תתחבר");
                location.reload();
            });
        } else {
            db.ref('users/' + u).once('value').then(function(s) {
                var data = s.val();
                if (!data) return alert("משתמש לא נמצא");
                if (document.getElementById('pass-div').classList.contains('hidden')) {
                    document.getElementById('pass-div').classList.remove('hidden');
                    alert("משתמש זוהה! הזן סיסמה");
                    return;
                }
                if (p === data.password) {
                    myName = u;
                    showMail();
                } else {
                    alert("סיסמה שגויה");
                }
            });
        }
    }

    function showMail() {
        document.getElementById('auth-ui').classList.add('hidden');
        document.getElementById('mail-ui').classList.remove('hidden');
        document.getElementById('hello').innerText = "שלום " + myName + "@bino";
        db.ref('messages').on('value', function(s) {
            var msgs = s.val();
            var h = "";
            for (var i in msgs) {
                if (msgs[i] && msgs[i].to === myName) {
                    h += "<div style='padding:5px; border-bottom:1px solid #ddd;'><b>" + msgs[i].from + ":</b> " + msgs[i].text + "</div>";
                }
            }
            document.getElementById('inbox').innerHTML = h || "אין הודעות";
        });
    }

    function doSend() {
        var t = document.getElementById('to').value.trim().toLowerCase().replace('@bino', '');
        var m = document.getElementById('msg').value;
        if (!t || !m) return alert("מלא נמען והודעה");
        db.ref('messages').push({ from: myName, to: t, text: m }).then(function() {
            alert("נשלח אל " + t + "@bino");
            document.getElementById('msg').value = "";
        });
    }
</script>
</body>
</html>
