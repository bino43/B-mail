<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Mail | Official</title>
    <!-- טעינת הספריות -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { font-family: sans-serif; background: #6a11cb; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 15px; width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #9b59b6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .hidden { display: none !important; }
        #status { font-size: 11px; color: gray; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>B-Mail</h1>
    
    <div id="auth-ui">
        <input type="text" id="u" placeholder="שם משתמש">
        <input type="password" id="p" placeholder="סיסמה">
        <button onclick="doRegister()">הרשמה (חדש)</button>
        <button onclick="doLogin()" style="background:#2575fc">התחברות</button>
    </div>

    <div id="mail-ui" class="hidden">
        <h3 id="hello"></h3>
        <div id="inbox" style="height:120px; border:1px solid #eee; overflow-y:auto; margin:10px 0; background:#f9f9f9; padding:5px; text-align:right;"></div>
        <input type="text" id="to" placeholder="אל">
        <input type="text" id="msg" placeholder="הודעה">
        <button onclick="doSend()" style="background:#28a745">שלח</button>
        <button onclick="location.reload()" style="background:#6c757d">התנתק</button>
    </div>
    
    <div id="status">טוען מערכת...</div>
</div>

<script>
    var db;
    var myName = "";

    // פונקציה שרצה רק כשהכל מוכן
    window.onload = function() {
        const config = {
            apiKey: "AIzaSyANG1mVIHW12mer7KKWl2RpUI7Ld2spOyI",
            authDomain: "://firebaseapp.com",
            projectId: "bmail-f3665",
            databaseURL: "https://firebaseio.com"
        };

        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(config);
            db = firebase.database();
            document.getElementById('status').innerText = "✅ מחובר לשרת Bino";
            console.log("Firebase Ready!");
        } else {
            document.getElementById('status').innerText = "❌ שגיאה: Firebase לא נטען";
        }
    };

    function doRegister() {
        var u = document.getElementById('u').value;
        var p = document.getElementById('p').value;
        if(!u || !p) return alert("מלא שם וסיסמה");
        
        db.ref('users/' + u).set({ password: p })
            .then(function() { alert("נרשמת! עכשיו תלחץ התחברות"); })
            .catch(function(e) { alert("שגיאה: " + e.message); });
    }

    function doLogin() {
        var u = document.getElementById('u').value;
        var p = document.getElementById('p').value;
        
        db.ref('users/' + u).once('value').then(function(s) {
            var data = s.val();
            if(data && data.password === p) {
                myName = u;
                showMail();
            } else {
                alert("שם או סיסמה לא נכונים");
            }
        });
    }

    function showMail() {
        document.getElementById('auth-ui').classList.add('hidden');
        document.getElementById('mail-ui').classList.remove('hidden');
        document.getElementById('hello').innerText = "שלום " + myName + "@bino";
        
        db.ref('messages').on('value', function(s) {
            var msgs = s.val();
            var html = "";
            for(var i in msgs) {
                if(msgs[i].to === myName) {
                    html += "<div><b>" + msgs[i].from + ":</b> " + msgs[i].text + "</div>";
                }
            }
            document.getElementById('inbox').innerHTML = html || "אין הודעות";
        });
    }

    function doSend() {
        var t = document.getElementById('to').value;
        var m = document.getElementById('msg').value;
        if(!t || !m) return;
        db.ref('messages').push({ from: myName, to: t, text: m })
            .then(function() { 
                alert("נשלח!"); 
                document.getElementById('msg').value = ""; 
            });
    }
</script>
</body>
</html>
